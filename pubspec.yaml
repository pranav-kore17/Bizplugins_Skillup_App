name: bizplugins_skillup
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+9

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  get: ^4.6.6
  http: ^1.2.1
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  fluttertoast: ^8.2.6
  flip_card: ^0.7.0
  intl: ^0.20.2
  pin_code_fields: ^8.0.1
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  flutter_launcher_icons: ^0.14.1
  connectivity_plus: ^6.1.0
  file_picker: ^10.1.1
  geolocator: ^13.0.4
  camera: ^0.11.1
  webview_flutter: ^4.13.0
  permission_handler: ^12.0.1
  path: ^1.9.1
  external_path: ^2.2.0
  flutter_pdfview: ^1.4.4
  syncfusion_flutter_charts: ^32.2.8
  syncfusion_flutter_pdfviewer: ^32.2.8

  video_player: ^2.10.1
  chewie: ^1.13.0
  get_storage: ^2.1.1
  google_nav_bar: ^5.0.7
  line_icons: ^2.0.3
  flutter_svg: ^2.0.9
  table_calendar: ^3.1.2
  video_thumbnail: ^0.5.6
  path_provider: ^2.1.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/bizskillup_icon.png"
  adaptive_icon_foreground: "assets/icons/bizskillup_icon.png"
  adaptive_icon_background: "#FFFFFF"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/pdfs/
    - assets/videos/
    - assets/data/sales_videos.json

